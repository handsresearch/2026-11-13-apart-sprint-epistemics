# LEAN FULL RUN (proposed): fits the $100 cap. Differences from plans/full.yaml:
# - each task runs only the baseline, its own positive control, and 'careful'
#   (calibration/uncertainty: neutral, overconfident, careful; pressure: neutral, sycophantic, careful)
# - 5 resamples instead of 10 for the consistency signal (6 agreement levels; ECE needs pooling)
# - 3 epochs instead of 5 (10 for the headline neutral/assert_wrong arm is a later top-up)
# Token counts are ASSUMPTIONS until the pilot measures them.
x-models: &models
  - anthropic/claude-haiku-5-5
  - openrouter/openai/gpt-5.6-luna
  - openrouter/qwen/qwen3.8-27b
  - openrouter/deepseek/deepseek-v4.1-flash
x-graders: &graders
  - openrouter/google/gemini-3.5-flash-lite
  - openrouter/openai/gpt-5.6-luna
  - anthropic/claude-haiku-5-5
runs:
  - {task: calibration, args: {persona: neutral, resamples: 5}, models: *models, epochs: 3, tokens: {calls_per_sample: 6, in: 280, out: 500}}
  - {task: calibration, args: {persona: overconfident, resamples: 5}, models: *models, epochs: 3, tokens: {calls_per_sample: 6, in: 280, out: 500}}
  - {task: calibration, args: {persona: careful, resamples: 5}, models: *models, epochs: 3, tokens: {calls_per_sample: 6, in: 280, out: 500}}
  - {task: pressure, args: {persona: neutral, kind: neutral_reask}, models: *models, epochs: 3, tokens: {calls_per_sample: 4, in: 520, out: 500}}
  - {task: pressure, args: {persona: neutral, kind: assert_wrong}, models: *models, epochs: 3, tokens: {calls_per_sample: 4, in: 520, out: 500}}
  - {task: pressure, args: {persona: neutral, kind: assert_right}, models: *models, epochs: 3, tokens: {calls_per_sample: 4, in: 520, out: 500}}
  - {task: pressure, args: {persona: sycophantic, kind: neutral_reask}, models: *models, epochs: 3, tokens: {calls_per_sample: 4, in: 520, out: 500}}
  - {task: pressure, args: {persona: sycophantic, kind: assert_wrong}, models: *models, epochs: 3, tokens: {calls_per_sample: 4, in: 520, out: 500}}
  - {task: pressure, args: {persona: sycophantic, kind: assert_right}, models: *models, epochs: 3, tokens: {calls_per_sample: 4, in: 520, out: 500}}
  - {task: pressure, args: {persona: careful, kind: neutral_reask}, models: *models, epochs: 3, tokens: {calls_per_sample: 4, in: 520, out: 500}}
  - {task: pressure, args: {persona: careful, kind: assert_wrong}, models: *models, epochs: 3, tokens: {calls_per_sample: 4, in: 520, out: 500}}
  - {task: pressure, args: {persona: careful, kind: assert_right}, models: *models, epochs: 3, tokens: {calls_per_sample: 4, in: 520, out: 500}}
  - {task: uncertainty, args: {persona: neutral}, graders: *graders, models: *models, epochs: 3, tokens: {calls_per_sample: 1, in: 170, out: 600, grader_in: 900, grader_out: 500}}
  - {task: uncertainty, args: {persona: overconfident}, graders: *graders, models: *models, epochs: 3, tokens: {calls_per_sample: 1, in: 170, out: 600, grader_in: 900, grader_out: 500}}
  - {task: uncertainty, args: {persona: careful}, graders: *graders, models: *models, epochs: 3, tokens: {calls_per_sample: 1, in: 170, out: 600, grader_in: 900, grader_out: 500}}
