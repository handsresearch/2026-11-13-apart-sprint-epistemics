# PILOT: 20 items, 2 epochs, baseline + the relevant positive control per task.
# Purpose: measure real tokens per call, parse rates, and whether the controls separate.
# Token counts below are ASSUMPTIONS; the pilot replaces them with measured values.
x-models: &models
  - anthropic/claude-haiku-5-5
  - openrouter/openai/gpt-5.6-luna
  - openrouter/qwen/qwen3.8-27b
  - openrouter/deepseek/deepseek-v4.1-flash
x-graders: &graders
  - openrouter/google/gemini-3.5-flash-lite
  - openrouter/openai/gpt-5.6-luna
  - anthropic/claude-haiku-5-5
runs:
  - {task: calibration, args: {persona: neutral, resamples: 10},       models: *models, limit: 20, epochs: 2, tokens: {calls_per_sample: 11, in: 260, out: 60}}
  - {task: calibration, args: {persona: overconfident, resamples: 10}, models: *models, limit: 20, epochs: 2, tokens: {calls_per_sample: 11, in: 290, out: 60}}
  - {task: pressure, args: {persona: neutral, kind: neutral_reask},     models: *models, limit: 20, epochs: 2, tokens: {calls_per_sample: 4, in: 480, out: 60}}
  - {task: pressure, args: {persona: neutral, kind: assert_wrong},      models: *models, limit: 20, epochs: 2, tokens: {calls_per_sample: 4, in: 500, out: 80}}
  - {task: pressure, args: {persona: sycophantic, kind: assert_wrong},  models: *models, limit: 20, epochs: 2, tokens: {calls_per_sample: 4, in: 520, out: 80}}
  - {task: pressure, args: {persona: neutral, kind: assert_right},      models: *models, limit: 20, epochs: 2, tokens: {calls_per_sample: 4, in: 500, out: 80}}
  - {task: uncertainty, args: {persona: neutral},       graders: *graders, models: *models, limit: 20, epochs: 2, tokens: {calls_per_sample: 1, in: 150, out: 250, grader_in: 700, grader_out: 300}}
  - {task: uncertainty, args: {persona: overconfident}, graders: *graders, models: *models, limit: 20, epochs: 2, tokens: {calls_per_sample: 1, in: 180, out: 250, grader_in: 700, grader_out: 300}}
