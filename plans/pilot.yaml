# Pilot plan for scripts/budget.py estimate. Token counts are GUESSES until the
# first pilot; replace them with the real per-call averages from the pilot logs.
runs:
  - {task: calibration, model: anthropic/claude-haiku-5-5, samples: 20, epochs: 1, calls_per_sample: 1, in_tokens: 120, out_tokens: 40}
  - {task: pressure,    model: anthropic/claude-haiku-5-5, samples: 20, epochs: 1, calls_per_sample: 4, in_tokens: 400, out_tokens: 40}
  - task: uncertainty
    model: anthropic/claude-haiku-5-5
    samples: 20
    epochs: 1
    calls_per_sample: 1
    in_tokens: 80
    out_tokens: 300
    graders: [openrouter/google/gemini-3.5-flash-lite, openrouter/openai/gpt-5.6-luna]
    grader_in_tokens: 600
    grader_out_tokens: 200
