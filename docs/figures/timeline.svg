<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Sprint timeline</title>
<desc id="d">Friday: review this PR, filter questions, run pilot. Saturday: full run after approval, hand-labelling. Sunday: analysis, report, submit before 23:59 AoE. Each day has a gate.</desc>
<rect width="760" height="300" rx="10" fill="#fcfcfb"/>
<text x="24" y="34" font-size="17" font-weight="600" fill="#0b0b0b">Plan for the weekend</text>
<text x="24" y="56" font-size="12.5" fill="#52514e">Deadline: Sun 15 Nov, 23:59 AoE. Each day ends with a gate before the next begins.</text>

<g font-size="12.5" fill="#0b0b0b">
  <!-- Friday -->
  <rect x="24" y="76" width="226" height="168" rx="8" fill="#ffffff" stroke="#d9d8d3"/>
  <rect x="24" y="76" width="226" height="6" rx="3" fill="#2a78d6"/>
  <text x="40" y="106" font-size="15" font-weight="600">Fri 13 · Set up</text>
  <text x="40" y="132">• Hana reviews this PR</text>
  <text x="40" y="152">• Filter 60 drafts → ~40 (keep)</text>
  <text x="40" y="172">• Check SimpleQA matcher (50)</text>
  <text x="40" y="192">• Pilot (~$5, needs approval)</text>
  <text x="40" y="226" font-size="11.5" fill="#52514e">Gate: controls separate, parse ≥ 95%</text>

  <!-- Saturday -->
  <rect x="267" y="76" width="226" height="168" rx="8" fill="#ffffff" stroke="#d9d8d3"/>
  <rect x="267" y="76" width="226" height="6" rx="3" fill="#eb6834"/>
  <text x="283" y="106" font-size="15" font-weight="600">Sat 14 · Run</text>
  <text x="283" y="132">• Re-estimate with pilot tokens</text>
  <text x="283" y="152">• Approve + run lean plan (~$79)</text>
  <text x="283" y="172">• Hand-label 50 disagreements</text>
  <text x="283" y="192">  (both of us, independently)</text>
  <text x="283" y="226" font-size="11.5" fill="#52514e">Gate: all runs done by Sat 22:00</text>

  <!-- Sunday -->
  <rect x="510" y="76" width="226" height="168" rx="8" fill="#ffffff" stroke="#d9d8d3"/>
  <rect x="510" y="76" width="226" height="6" rx="3" fill="#1baf7a"/>
  <text x="526" y="106" font-size="15" font-weight="600">Sun 15 · Write</text>
  <text x="526" y="132">• Analysis + figures</text>
  <text x="526" y="152">• Report ≤ 8 pages + appendix</text>
  <text x="526" y="172">• Abstract 150–250 words</text>
  <text x="526" y="192">• Submit early, resubmit if needed</text>
  <text x="526" y="226" font-size="11.5" fill="#52514e">Gate: submitted by Sun 20:00 local</text>
</g>
<text x="24" y="276" font-size="11.5" fill="#52514e">Every run over $3 needs explicit approval first (AGENTS.md). Pre-sprint scaffolding (≤ 8cda680) is disclosed in README and report.</text>
</svg>
