[project]
name = "epivirtue"
version = "0.1.0"
description = "Epistemic virtue eval suite (Inspect tasks) for the Apart AI x Epistemics sprint"
requires-python = ">=3.11"
dependencies = [
  "inspect-ai>=0.3.289",
  "anthropic",
  "openai",
  "pandas",
  "pyarrow",
  "matplotlib",
  "python-dotenv",
  "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["evals"]
